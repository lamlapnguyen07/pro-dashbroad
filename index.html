<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="團隊看板">
<title>團隊看板</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<header id="hud" hidden>
  <div class="hud-code">TEAM BOARD</div>
  <h1 id="hud-title"></h1>
  <div class="chips" id="hud-chips"></div>
  <div id="focus" hidden></div>
</header>

<nav id="nav" hidden>
  <button data-view="dashboard">📊 總覽</button>
  <button data-view="team">👥 團隊</button>
  <button data-view="mail">✉️ 信件</button>
  <button data-view="layout" class="icon" aria-label="排列城市">🏗️</button>
  <button data-view="settings" class="icon" aria-label="設定">⚙️</button>
</nav>

<aside id="panel" hidden>
  <div class="panel-head">
    <h2 id="panel-title"></h2>
    <button id="panel-close" aria-label="關閉">✕</button>
  </div>
  <div id="panel-body"></div>
</aside>

<div id="lock">
  <form class="lock-card" id="lock-form">
    <div class="ico">🔒</div>
    <h2>團隊看板</h2>
    <div class="muted">內容已加密，只在這台裝置上解開。</div>
    <input class="field" id="lock-pw" type="password" placeholder="輸入密碼" autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="lock-remember"> 在這台裝置記住密碼</label>
    <button class="btn" type="submit" id="lock-btn">解鎖</button>
    <div class="err" id="lock-err"></div>
  </form>
</div>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
